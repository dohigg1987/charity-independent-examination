name: Clarity IE CI
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.0, cache: npm }
      - run: npm ci
      - run: npm run security:audit -- --audit-level=high
      - run: npm run migrations:check
      - run: npm test
      - name: Seal immutable release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '{"commit":"%s"}\n' "$COMMIT_SHA" > dist/RELEASE.json
          LC_ALL=C find dist -type f ! -path dist/SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          digest=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest immutable release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Upload immutable release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: clarity-ie-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
