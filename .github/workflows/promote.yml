name: Promote Clarity IE
on:
  workflow_call:
    inputs:
      target: { required: true, type: string }
      commit: { required: true, type: string }
      artifact_run_id: { required: true, type: string }
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: clarity-ie-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.commit }}", fetch-depth: 0 }
      - name: Enforce pinned source and ordered promotion
        shell: bash
        env: { TARGET_ENV: "${{ inputs.target }}", COMMIT_SHA: "${{ inputs.commit }}" }
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          case "$TARGET_ENV" in dev) prerequisite="" ;; test) prerequisite=dev ;; preprod) prerequisite=test ;; production) prerequisite=preprod ;; *) exit 1 ;; esac
          if [[ "$TARGET_ENV" == production ]]; then git fetch origin main; git merge-base --is-ancestor "$COMMIT_SHA" origin/main; fi
          if [[ -n "$prerequisite" ]]; then tag="deployed-${prerequisite}-${COMMIT_SHA}"; git fetch origin "refs/tags/${tag}:refs/tags/${tag}"; test "$(git rev-list -n 1 "$tag")" = "$COMMIT_SHA"; fi
      - uses: actions/setup-node@v7
        with: { node-version: 22.13.0, cache: npm }
      - run: npm ci
      - name: Download immutable CI artifact
        uses: actions/download-artifact@v4
        with:
          name: clarity-ie-release-${{ inputs.commit }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify artifact identity, completeness and provenance
        id: artifact
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -er .commit dist/RELEASE.json)" = "$COMMIT_SHA"
          LC_ALL=C find dist -type f ! -path dist/SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > actual-SHA256SUMS
          cmp --silent dist/SHA256SUMS actual-SHA256SUMS
          gh attestation verify dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$COMMIT_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          digest=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Render isolated environment configuration
        id: config
        env:
          DEPLOY_ENV: ${{ inputs.target }}
          BUILD_COMMIT_SHA: ${{ inputs.commit }}
          BUILD_ARTIFACT_SHA256: ${{ steps.artifact.outputs.digest }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: echo "path=$(node scripts/render-cloudflare-config.mjs)" >> "$GITHUB_OUTPUT"
      - name: Prepare version-scoped auth secrets
        id: secrets
        env:
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
        run: echo "path=$(node scripts/write-cloudflare-secrets.mjs)" >> "$GITHUB_OUTPUT"
      - name: Apply checksum-locked Neon migrations
        env: { NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: node scripts/migrate-neon.mjs
      - name: Capture and verify rollback target
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          deployments=$(npx wrangler deployments list --config "${{ steps.config.outputs.path }}" --json 2>/dev/null || printf '[]')
          previous=$(printf '%s' "$deployments" | jq -r 'if length == 0 then "" else (.[-1].versions | max_by(.percentage) | .version_id // "") end')
          echo "version_id=$previous" >> "$GITHUB_OUTPUT"

          previous_commit=""
          if [[ -n "$previous" ]]; then
            probe="rollback-target-${previous}-$(date +%s%N)"
            http_status=$(curl --connect-timeout 10 --max-time 20 -sS -o previous-health.json -w '%{http_code}' "${PUBLIC_SITE_URL%/}/api/health?assurance_probe=${probe}" || true)
            [[ "$http_status" == 200 ]]
            previous_commit=$(jq -er --arg version "$previous" 'select(.status == "ok" and .version == $version and .checks.database == true and .checks.objectStorage == true) | .commit' previous-health.json)
            [[ "$previous_commit" =~ ^[a-f0-9]{40}$ ]]
          fi
          echo "commit_sha=$previous_commit" >> "$GITHUB_OUTPUT"
      - name: Upload immutable Worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          PREVIOUS_VERSION: "${{ steps.previous.outputs.version_id }}"
        shell: bash
        run: |
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            output=$(npx wrangler versions upload --config "${{ steps.config.outputs.path }}" --secrets-file "${{ steps.secrets.outputs.path }}" --tag "${{ inputs.commit }}" --message "${{ inputs.target }} from ${{ inputs.commit }}")
          else
            output=$(npx wrangler deploy --config "${{ steps.config.outputs.path }}" --secrets-file "${{ steps.secrets.outputs.path }}" --tag "${{ inputs.commit }}" --message "Bootstrap ${{ inputs.target }} from ${{ inputs.commit }}")
          fi
          version_id=$(printf '%s\n' "$output" | sed -nE 's/.*Version ID: ([a-f0-9-]+).*/\1/p' | tail -1); test -n "$version_id"; echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Deploy, assure and automatically roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          NEW_VERSION: ${{ steps.upload.outputs.version_id }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit_sha }}
          TARGET_ENV: ${{ inputs.target }}
          COMMIT_SHA: ${{ inputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          config="${{ steps.config.outputs.path }}"

          assure_health() {
            local expected_version="$1" expected_commit="$2" label="$3" max_attempts="$4" retry_delay="$5" initial_grace="$6"
            local attempt probe health_url http_status
            sleep "$initial_grace"
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              probe="${expected_version}-${attempt}-$(date +%s%N)"
              health_url="${PUBLIC_SITE_URL%/}/api/health?assurance_probe=${probe}"
              http_status=$(curl --connect-timeout 10 --max-time 20 -sS -o health.json -w '%{http_code}' "$health_url" || true)
              echo "${label} health attempt ${attempt}/${max_attempts}: HTTP ${http_status}"

              if jq -e . health.json >/dev/null 2>&1; then
                jq -c '{status, environment, commit, version, checks: {database: (.checks.database // false), objectStorage: (.checks.objectStorage // false)}}' health.json
              else
                echo "Health response was not valid JSON"
              fi

              if [[ "$http_status" == 200 ]] && jq -e --arg version "$expected_version" --arg commit "$expected_commit" '.status == "ok" and .commit == $commit and .version == $version and .checks.database == true and .checks.objectStorage == true' health.json >/dev/null; then
                return 0
              fi
              if (( attempt < max_attempts )); then sleep "$retry_delay"; fi
            done
            return 1
          }

          rollback() {
            local status=$?
            trap - ERR
            if [[ -n "$PREVIOUS_VERSION" ]]; then
              if ! npx wrangler rollback "$PREVIOUS_VERSION" --config "$config" --message "Automatic rollback after failed assurance" --yes; then
                echo "::error::Automatic rollback command failed; environment state requires immediate verification"
                exit 1
              fi
              if ! assure_health "$PREVIOUS_VERSION" "$PREVIOUS_COMMIT" "Rollback" 18 10 20; then
                echo "::error::Rollback completed but the previous commit/version did not become healthy"
                exit 1
              fi
            fi
            exit "$status"
          }
          trap rollback ERR

          if [[ "$TARGET_ENV" == production && -n "$PREVIOUS_VERSION" ]]; then
            npx wrangler versions deploy "${NEW_VERSION}@10" "${PREVIOUS_VERSION}@90" --config "$config" --message "Production canary" --yes
            if ! assure_health "$NEW_VERSION" "$COMMIT_SHA" "Production canary" 40 3 5; then
              echo "::error::Production canary did not return the exact healthy release"
              false
            fi
          fi

          npx wrangler versions deploy "${NEW_VERSION}@100" --config "$config" --message "Assured ${TARGET_ENV} release" --yes
          if [[ "$TARGET_ENV" == production ]]; then
            if ! assure_health "$NEW_VERSION" "$COMMIT_SHA" "Production rollout" 18 10 30; then
              echo "::error::Production rollout did not converge to the exact healthy release"
              false
            fi
          elif ! assure_health "$NEW_VERSION" "$COMMIT_SHA" "${TARGET_ENV} rollout" 12 5 5; then
            echo "::error::${TARGET_ENV} rollout did not converge to the exact healthy release"
            false
          fi
          trap - ERR
      - name: Record successful deployment
        env: { TARGET_ENV: "${{ inputs.target }}", COMMIT_SHA: "${{ inputs.commit }}" }
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          tag="deployed-${TARGET_ENV}-${COMMIT_SHA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT_SHA"
          else
            git tag -a "$tag" -m "$TARGET_ENV deployment of $COMMIT_SHA"
            git push origin "$tag"
          fi

