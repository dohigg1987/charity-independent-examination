name: Release Clarity IE through environments
on:
  workflow_run:
    workflows: ["Clarity IE CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA produced by the successful main CI run
        required: true
        type: string
      artifact_run_id:
        description: Successful main CI workflow run ID containing the release artifact
        required: true
        type: string
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: clarity-ie-release-chain
  cancel-in-progress: false
jobs:
  deploy-dev:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/promote.yml
    with:
      target: dev
      commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}
      artifact_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
    secrets: inherit
  deploy-test:
    needs: deploy-dev
    uses: ./.github/workflows/promote.yml
    with:
      target: test
      commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}
      artifact_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
    secrets: inherit
  deploy-preprod:
    needs: deploy-test
    uses: ./.github/workflows/promote.yml
    with:
      target: preprod
      commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}
      artifact_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
    secrets: inherit
  deploy-production:
    needs: deploy-preprod
    uses: ./.github/workflows/promote.yml
    with:
      target: production
      commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}
      artifact_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
    secrets: inherit

